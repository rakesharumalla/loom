[project]
name = "loom-databricks-demo"
version = "0.1.0"
description = "Loom storage layer on Databricks (demo)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "databricks-sdk==0.149.0",
  "databricks-agentbricks==0.4.0",
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "mcp>=2.2",
  "pyyaml>=6",
  "mlflow>=3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
